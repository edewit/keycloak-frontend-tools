<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("rp-theme");
        if (theme === "main" || theme === "dawn") {
          document.documentElement.dataset.theme = theme;
        }
      } catch (e) {}
    })();
  </script>
  {#insert head-meta}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {#seo page site/}
  {#favicon site/}
  {#rss site/}
  {#bundle /}
  {/insert}
  {#insert head /}
</head>
<body {#if page.data.body-class??}class="{page.data.body-class}"{/}>
  {#insert /}
</body>
</html>
